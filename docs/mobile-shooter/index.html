<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>モバイルシューティング</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #05070f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    h1 { font-size: 1rem; margin: 10px 0 6px; }
    #gameWrap { width: min(100vw, 480px); position: relative; }
    canvas {
      width: 100%;
      height: auto;
      background: radial-gradient(circle at top, #101b3a, #060810 70%);
      border: 1px solid #24345f;
      border-radius: 12px;
      display: block;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin: 8px 4px;
    }
    #controls {
      width: min(100vw, 480px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px;
    }
    button {
      font-size: 1.1rem;
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      background: #1d2a4d;
      color: #fff;
      user-select: none;
      touch-action: manipulation;
    }
    button:active { background: #2b3d70; }
    #shoot { grid-column: span 3; background: #8a1f36; }
    #shoot:active { background: #b12d4b; }
    #msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }
  </style>
</head>
<body>
  <h1>スマホ向けミニシューティング</h1>
  <div id="gameWrap">
    <div id="hud"><span id="score">Score: 0</span><span id="hp">HP: 3</span></div>
    <canvas id="game" width="360" height="640"></canvas>
    <div id="msg">タップで開始</div>
  </div>
  <div id="controls">
    <button id="left">◀ 左</button>
    <button id="right">右 ▶</button>
    <button id="shoot">発射</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hpEl = document.getElementById('hp');
    const msgEl = document.getElementById('msg');

    const state = {
      running: false,
      score: 0,
      hp: 3,
      player: { x: 180, y: 590, w: 28, h: 20, speed: 5 },
      bullets: [],
      enemies: [],
      stars: Array.from({length: 60}, () => ({ x: Math.random()*360, y: Math.random()*640, s: Math.random()*2+1 })),
      lastEnemyAt: 0,
      leftOn: false,
      rightOn: false,
      shootOn: false,
      lastShotAt: 0,
    };

    function reset() {
      state.score = 0; state.hp = 3;
      state.player.x = 180;
      state.bullets = []; state.enemies = [];
      state.lastEnemyAt = 0; state.lastShotAt = 0;
      scoreEl.textContent = 'Score: 0';
      hpEl.textContent = 'HP: 3';
      msgEl.textContent = '';
      state.running = true;
    }

    function spawnEnemy(t) {
      if (t - state.lastEnemyAt < 700) return;
      state.lastEnemyAt = t;
      state.enemies.push({
        x: 20 + Math.random() * (canvas.width - 40),
        y: -20,
        r: 12,
        speed: 1.5 + Math.random() * 2,
      });
    }

    function shoot(t) {
      if (t - state.lastShotAt < 180) return;
      state.lastShotAt = t;
      state.bullets.push({ x: state.player.x, y: state.player.y - 12, r: 4, speed: 8 });
    }

    function update(t) {
      if (!state.running) return;
      if (state.leftOn) state.player.x -= state.player.speed;
      if (state.rightOn) state.player.x += state.player.speed;
      state.player.x = Math.max(state.player.w/2, Math.min(canvas.width - state.player.w/2, state.player.x));
      if (state.shootOn) shoot(t);

      spawnEnemy(t);

      state.stars.forEach(s => { s.y += s.s * 0.6; if (s.y > 640) { s.y = -2; s.x = Math.random()*360; } });
      state.bullets.forEach(b => b.y -= b.speed);
      state.enemies.forEach(e => e.y += e.speed);

      state.bullets = state.bullets.filter(b => b.y > -20);
      state.enemies = state.enemies.filter(e => {
        if (e.y > 660) {
          state.hp -= 1;
          hpEl.textContent = `HP: ${state.hp}`;
          return false;
        }
        return true;
      });

      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        for (let j = state.bullets.length - 1; j >= 0; j--) {
          const b = state.bullets[j];
          const dx = e.x - b.x, dy = e.y - b.y;
          if (dx*dx + dy*dy < (e.r + b.r) ** 2) {
            state.enemies.splice(i, 1);
            state.bullets.splice(j, 1);
            state.score += 10;
            scoreEl.textContent = `Score: ${state.score}`;
            break;
          }
        }
      }

      if (state.hp <= 0) {
        state.running = false;
        msgEl.textContent = `ゲームオーバー\nScore: ${state.score}\nタップで再開`;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of state.stars) {
        ctx.fillStyle = '#b8cffd';
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }

      // player
      ctx.fillStyle = '#6ee7ff';
      ctx.beginPath();
      ctx.moveTo(state.player.x, state.player.y - state.player.h/2);
      ctx.lineTo(state.player.x - state.player.w/2, state.player.y + state.player.h/2);
      ctx.lineTo(state.player.x + state.player.w/2, state.player.y + state.player.h/2);
      ctx.closePath();
      ctx.fill();

      // bullets
      ctx.fillStyle = '#fff089';
      for (const b of state.bullets) {
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      }

      // enemies
      for (const e of state.enemies) {
        ctx.fillStyle = '#ff5a78';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
      }
    }

    function frame(t) {
      update(t);
      draw();
      requestAnimationFrame(frame);
    }

    function bindHold(btn, onStart, onEnd = onStart) {
      btn.addEventListener('pointerdown', e => { e.preventDefault(); onStart(true); });
      btn.addEventListener('pointerup',   e => { e.preventDefault(); onEnd(false); });
      btn.addEventListener('pointercancel', () => onEnd(false));
      btn.addEventListener('pointerleave', () => onEnd(false));
    }

    bindHold(document.getElementById('left'), v => state.leftOn = v);
    bindHold(document.getElementById('right'), v => state.rightOn = v);
    bindHold(document.getElementById('shoot'), v => state.shootOn = v);

    canvas.addEventListener('pointerdown', () => {
      if (!state.running) reset();
      else shoot(performance.now());
    });

    msgEl.addEventListener('pointerdown', () => { if (!state.running) reset(); });
    requestAnimationFrame(frame);
  </script>
</body>
</html>
